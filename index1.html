<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動報名系統</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; background-color: #f4f6f9; padding: 20px; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
    h2 { text-align: center; color: #1e3a8a; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #00c300; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

<div class="card">
  <h2>活動報名系統</h2>
  <div class="form-group">
    <label>姓名</label>
    <input type="text" id="name" placeholder="請輸入姓名" required>
  </div>
  <div class="form-group">
    <label>單位 / 社別</label>
    <input type="text" id="club" placeholder="例如：台北扶輪社" required>
  </div>
  <div class="form-group">
    <label>職稱 / 角色</label>
    <select id="role">
      <option value="社友">社友</option>
      <option value="執秘">執秘</option>
      <option value="貴賓">貴賓</option>
      <option value="工作人員">工作人員</option>
    </select>
  </div>
  <div class="form-group">
    <label>手機號碼</label>
    <input type="tel" id="phone" placeholder="0912-345-678" required>
  </div>
  <button id="submitBtn" onclick="submitForm()">確認報名</button>
</div>

<script>
  const LIFF_ID = "YOUR_LIFF_ID"; // 替換為您的 LIFF ID
  const GAS_URL = "YOUR_GAS_WEB_APP_URL"; // 替換為您的 Google Apps Script 網址
  let currentUserId = "";

  async function initializeLiff() {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
    } else {
      const profile = await liff.getProfile();
      currentUserId = profile.userId;
      // 若 LINE 暱稱有值，可預填至姓名
      if (profile.displayName) document.getElementById('name').value = profile.displayName;
    }
  }

  async function submitForm() {
    const name = document.getElementById('name').value.trim();
    const club = document.getElementById('club').value.trim();
    const role = document.getElementById('role').value;
    const phone = document.getElementById('phone').value.trim();

    if (!name || !club || !phone) {
      alert("請填寫所有必要欄位！");
      return;
    }

    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').innerText = "送出中...";

    try {
      const response = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "register", // 標記為報名請求
          userId: currentUserId,
          name: name,
          club: club,
          role: role,
          phone: phone
        })
      });

      const res = await response.json();
      if (res.status === "success") {
        alert("報名成功！活動當天請使用專屬 QR Code 簽到。");
        liff.closeWindow(); // 關閉 LINE 網頁視窗
      } else {
        alert(res.message);
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').innerText = "確認報名";
      }
    } catch (err) {
      alert("連線發生問題，請稍後再試！");
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').innerText = "確認報名";
    }
  }

  initializeLiff();
</script>
</body>
</html>
